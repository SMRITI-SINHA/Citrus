<title>CITRUS Trade</title>
<meta name="theme-color" content="#0F1B2D">
<meta name="description" content="CITRUS Trade: retailer ordering for CITRUS menswear">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
/* Layout: one adaptive shell. Phone = header + bottom tabs + floating mini-cart; tablet/desktop = quiet side rail + wide canvas.
   Direction: menswear atelier. Cool stone neutrals, ink black, one saffron "zest" accent used only for points and live state.
   Editorial serif for headlines, precise grotesk for everything operational. Thin demo strip above is not part of the product. */
:root{
  --bg:#F3F4F3; --surface:#FFFFFF; --surface-2:#EEF0EF; --tile:#E9ECEB; --tile-2:#DFE3E2;
  --ink:#111312; --ink-2:#2B2F2E; --muted:#646B6A; --line:#E1E5E4; --line-2:#D3D8D7;
  --primary:#111312; --on-primary:#FFFFFF;
  --deep:#0F1B2D; --on-deep:#F4F2EC; --deep-2:#1B2A44;
  --citrus:#E5A50A; --on-citrus:#111312; --citrus-soft:#FBF1D6; --citrus-ink:#8A5E00;
  --ok:#1C7A50; --ok-soft:#E1F2E9; --warn:#946000; --warn-soft:#FBF0D8; --bad:#B4372F; --bad-soft:#FBE6E3;
  --strip:#0A0C0B; --strip-ink:#B9BEBC; --wa:#1C7A50; --wa-soft:#E3F3EA;
  --shadow:0 1px 2px rgba(17,19,18,.05),0 10px 30px -12px rgba(17,19,18,.18);
  --shadow-lg:0 30px 60px -24px rgba(15,27,45,.35);
  --f-display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Geist","Noto Sans Devanagari",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0D0D; --surface:#131616; --surface-2:#1A1E1E; --tile:#1C2121; --tile-2:#252B2B;
  --ink:#EEEEEA; --ink-2:#D5D7D3; --muted:#9BA2A0; --line:#262C2C; --line-2:#333A3A;
  --primary:#F1F0EA; --on-primary:#111312;
  --deep:#14223A; --on-deep:#F4F2EC; --deep-2:#1F3150;
  --citrus:#F1B42B; --on-citrus:#111312; --citrus-soft:#33290F; --citrus-ink:#F1C35C;
  --ok:#55C893; --ok-soft:#15332A; --warn:#E9B24C; --warn-soft:#382B12; --bad:#F07C72; --bad-soft:#3C1E1C;
  --strip:#050606; --strip-ink:#A9AFAD; --wa:#55C893; --wa-soft:#15332A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.5); --shadow-lg:0 30px 60px -24px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D0D; --surface:#131616; --surface-2:#1A1E1E; --tile:#1C2121; --tile-2:#252B2B;
  --ink:#EEEEEA; --ink-2:#D5D7D3; --muted:#9BA2A0; --line:#262C2C; --line-2:#333A3A;
  --primary:#F1F0EA; --on-primary:#111312;
  --deep:#14223A; --on-deep:#F4F2EC; --deep-2:#1F3150;
  --citrus:#F1B42B; --on-citrus:#111312; --citrus-soft:#33290F; --citrus-ink:#F1C35C;
  --ok:#55C893; --ok-soft:#15332A; --warn:#E9B24C; --warn-soft:#382B12; --bad:#F07C72; --bad-soft:#3C1E1C;
  --strip:#050606; --strip-ink:#A9AFAD; --wa:#55C893; --wa-soft:#15332A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.5); --shadow-lg:0 30px 60px -24px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--citrus);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.005em;line-height:1.08}
h1 em,h2 em{font-style:italic}
.mono{font-family:var(--f-mono);font-size:.84em;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- demo strip ---- */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--strip);color:var(--strip-ink);display:flex;align-items:center;gap:10px;padding:6px 16px;font-size:12px;flex-wrap:wrap}
.strip .tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#F1B42B;white-space:nowrap}
.roles{display:flex;gap:2px;background:rgba(255,255,255,.06);border-radius:999px;padding:2px}
.roles button{padding:5px 12px;border-radius:999px;color:var(--strip-ink);font-weight:500;font-size:12px;white-space:nowrap}
.roles button[aria-pressed="true"]{background:#F1F0EA;color:#111312}
.strip .sp{flex:1}
.strip .lnk{color:var(--strip-ink);padding:5px 8px;border-radius:8px;font-weight:500}
.strip .lnk:hover{color:#fff}

/* ---- app shell ---- */
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:calc(100% - 36px)}
.rail{display:none}
.main{min-width:0;display:flex;flex-direction:column;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.appbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--stripH,36px));z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
.appbar .who{min-width:0;flex:1}
.appbar .who b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .who span{font-size:12px;color:var(--muted)}
.brand{display:flex;align-items:baseline;gap:7px;font-family:var(--f-body);font-weight:700;font-size:15px;letter-spacing:.32em;text-transform:uppercase}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--citrus);align-self:center;font-size:0;color:transparent;flex:0 0 auto}
.brand small{font-family:var(--f-display);font-style:italic;font-weight:400;letter-spacing:0;text-transform:none;font-size:19px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:12.5px;white-space:nowrap}
.pill .z{width:8px;height:8px;border-radius:50%;background:var(--citrus)}
.iconbtn{position:relative;width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:10.5px;font-weight:700;display:grid;place-items:center}
.content{padding:18px 16px 28px;display:flex;flex-direction:column;gap:30px;width:100%;max-width:1280px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;letter-spacing:.02em;color:var(--muted);padding:4px 0;position:relative}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"]::after{content:"";position:absolute;top:-7px;width:18px;height:2px;border-radius:2px;background:var(--ink)}
.tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:10px;display:grid;place-items:center;padding:0 4px}
svg.i{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

@media (min-width:768px){
  .shell{grid-template-columns:240px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--stripH,36px));height:calc(100vh - var(--stripH,36px));padding:22px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .rail .brand{padding:4px 10px 26px}
  .rail button.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-weight:500;color:var(--muted);text-align:left;transition:background .15s,color .15s}
  .rail button.nav:hover{background:var(--surface-2);color:var(--ink)}
  .rail button.nav[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600}
  .rail .nav .badge{margin-left:auto;background:var(--ink);color:var(--bg);border-radius:999px;font-size:10.5px;font-weight:700;padding:1px 7px}
  .rail .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:12px;border-top:1px solid var(--line)}
  .rail .foot b{display:block;color:var(--ink);font-weight:600}
  .tabbar{display:none}
  .main{padding-bottom:32px}
  .appbar{padding:12px 28px}
  .appbar .brand{display:none}
  .content{padding:28px 28px 40px;gap:40px}
}
@media (max-width:767px){.appbar .hide-sm{display:none}}

/* ---- common blocks ---- */
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sec-h h2{font-size:26px}
.sec-h .sub{font-size:13px;color:var(--muted);margin-top:4px}
.linkbtn{color:var(--ink);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;text-decoration-color:var(--line-2);white-space:nowrap}
.linkbtn:hover{text-decoration-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;letter-spacing:.01em;background:var(--primary);color:var(--on-primary);min-height:46px;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.sec:hover{border-color:var(--ink)}
.btn.citrus{background:var(--citrus);color:var(--on-citrus)}
.btn.light{background:var(--on-deep);color:var(--deep)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 50%,transparent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 14px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-weight:500;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{background:var(--ok-soft);color:var(--ok)} .s-warn{background:var(--warn-soft);color:var(--warn)} .s-bad{background:var(--bad-soft);color:var(--bad)} .s-info{background:var(--surface-2);color:var(--ink)}
.note{padding:12px 14px;border-radius:12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--ink)} .note.bad{background:var(--bad-soft)} .note.ok{background:var(--ok-soft)} .note.info{background:var(--surface-2)}
.note b{display:block;font-weight:600}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,46%);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}
@media (min-width:768px){.hscroll{grid-auto-columns:minmax(200px,23.5%);gap:18px}}
@media (min-width:1200px){.hscroll{grid-auto-columns:minmax(210px,18.8%)}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}
@media (min-width:768px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 18px}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* product tile */
.ptile{display:flex;flex-direction:column;gap:9px;text-align:left;min-width:0;position:relative}
.ptile .img{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:var(--r);background:radial-gradient(120% 90% at 50% 30%,var(--surface) 0%,var(--tile) 70%);display:grid;place-items:center;overflow:hidden;transition:transform .25s}
.ptile:hover .img svg{transform:scale(1.035)}
.ptile .img svg{width:74%;height:74%;transition:transform .35s ease;filter:drop-shadow(0 14px 14px rgba(17,19,18,.16))}
.ptile .tags{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px}
.tagx{font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--surface);color:var(--ink)}
.tagx.pts{background:var(--citrus-soft);color:var(--citrus-ink)}
.tagx.new{background:var(--ink);color:var(--bg);letter-spacing:.12em}
.quick{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:999px;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow);border:1px solid var(--line)}
.quick:hover{background:var(--ink);color:var(--bg)}
.ptile .nm{font-weight:600;font-size:14px;line-height:1.3}
.ptile .meta{font-size:12px;color:var(--muted)}
.ptile .price{font-weight:600;font-size:14px}
.ptile .price s{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px;text-decoration-thickness:1px}
.swatches{display:flex;gap:5px;align-items:center}
.sw{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sizestrip{display:flex;gap:4px;flex-wrap:wrap}
.sz{font-size:10.5px;font-weight:500;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sz.low{background:var(--warn-soft);color:var(--warn)}
.sz.out{text-decoration:line-through;color:var(--muted);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.why{font-size:12px;color:var(--ink-2);border-left:2px solid var(--citrus);padding:2px 0 2px 9px;line-height:1.35}

/* editorial hero */
.hero-b{position:relative;overflow:hidden;border-radius:22px;background:var(--deep);color:var(--on-deep);display:grid;grid-template-columns:minmax(0,1fr);min-height:220px}
.hero-b .copy{position:relative;z-index:1;padding:26px 22px;display:flex;flex-direction:column;gap:12px;justify-content:flex-end}
.hero-b h1{font-size:clamp(34px,6vw,58px);line-height:.98}
.hero-b .eyebrow{color:color-mix(in srgb,var(--on-deep) 70%,transparent)}
.hero-b p{margin:0;max-width:44ch;color:color-mix(in srgb,var(--on-deep) 80%,transparent);font-size:14px}
.hero-b .art{position:absolute;right:-30px;bottom:-12px;width:min(52%,300px);opacity:.95}
.hero-b .art svg{width:100%;height:auto;filter:drop-shadow(0 30px 30px rgba(0,0,0,.35))}
.hero-b .copy .acts{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:599px){.hero-b .copy{padding-right:44%}.hero-b h1{font-size:34px}.hero-b p{display:none}}
@media (min-width:900px){.hero-b{min-height:300px}.hero-b .copy{padding:40px 44px}.hero-b .art{right:4%;width:280px}}

/* reorder card */
.ro{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ro .thumbs{display:flex;gap:6px}
.ro .thumbs div{width:46px;height:56px;border-radius:10px;background:var(--tile);display:grid;place-items:center}
.ro .thumbs svg{width:80%;height:80%}

/* rewards */
.rw{padding:22px;display:flex;flex-direction:column;gap:14px;background:var(--deep);color:var(--on-deep);border-radius:22px;overflow:hidden;position:relative}
.rw .eyebrow{color:color-mix(in srgb,var(--on-deep) 70%,transparent)}
.rw .big{font-family:var(--f-display);font-size:48px;line-height:1}
.rw .bar{height:6px;border-radius:999px;background:color-mix(in srgb,var(--on-deep) 18%,transparent);overflow:hidden}
.rw .bar i{display:block;height:100%;background:var(--citrus);border-radius:999px}
.ticker{overflow:hidden;white-space:nowrap;font-size:12px;letter-spacing:.04em;color:color-mix(in srgb,var(--on-deep) 75%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker span{display:inline-block;padding-left:100%;animation:tick 26s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}

/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 18px;min-height:50px;box-shadow:0 1px 2px rgba(17,19,18,.04)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:15px}
.search:focus-within{border-color:var(--ink)}
.search kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}

/* product page */
.pdp{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:900px){.pdp{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:start}.pdp .gallery{position:sticky;top:120px}}
.gallery .hero{aspect-ratio:4/5;max-width:100%;border-radius:22px;background:radial-gradient(110% 80% at 50% 28%,var(--surface) 0%,var(--tile) 72%);display:grid;place-items:center;position:relative}
.gallery .hero svg{width:70%;height:70%;filter:drop-shadow(0 24px 22px rgba(17,19,18,.18))}
.gallery .hero .tags{position:absolute;top:14px;left:14px;display:flex;gap:6px}
.look{display:flex;gap:12px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.look button{flex:0 0 auto;width:96px;text-align:left;font-size:11.5px;display:flex;flex-direction:column;gap:6px}
.look .lk{width:96px;height:124px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;transition:border-color .15s}
.look button:hover .lk{border-color:var(--ink)}
.look .lk svg{width:88%;height:92%}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-weight:500;font-size:13px}
.colors button .sw{width:24px;height:24px}
.colors button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sgrid{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.srow{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .s{font-family:var(--f-display);font-size:22px}
.srow .a{font-size:13px}
.srow .a b{font-variant-numeric:tabular-nums;font-weight:600}
.srow .meter{height:3px;border-radius:2px;background:var(--surface-2);margin-top:5px;max-width:140px;overflow:hidden}
.srow .meter i{display:block;height:100%;background:var(--ink-2)}
.srow.out{opacity:.5}
.step{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;background:var(--surface)}
.step button{width:40px;height:40px;font-size:18px;font-weight:500}

function filtered(){
  const f=S.filters,q=S.query.trim().toLowerCase();
  let rows=[];
  for(const s of STYLES){
    if(!q&&s.cat!==S.cat)continue;
    if(f.fit.length&&!f.fit.includes(s.fit))continue;
    if(f.pattern.length&&!f.pattern.includes(s.pattern))continue;
    for(const c of s.colors){
      if(f.color.length&&!f.color.includes(c))continue;
      if(q&&!(s.name+' '+c+' '+s.id+' '+s.fabric+' '+s.cat+' '+s.fit+' '+s.pattern).toLowerCase().includes(q))continue;
      const tot=totalAvail(s.id,c);
      if(f.instock&&tot===0)continue;
      rows.push({s,c,tot,score:(AFF[s.id]||0)*10+(c==='Sky Blue'||c==='Khaki'||c==='Charcoal'?8:0)+Math.min(tot,80)/8});
    }
  }
  const by={best:(a,b)=>b.score-a.score,avail:(a,b)=>b.tot-a.tot,new:(a,b)=>(b.s.isNew?1:0)-(a.s.isNew?1:0)||b.score-a.score,points:(a,b)=>b.s.pts-a.s.pts};
  return rows.sort(by[S.sort]);
}

// Largest-remainder split by ratio; sizes that hit their stock pass the overflow to sizes that still have room.
function splitTotal(sid,c,total){
  const s=S_BY[sid],zs=SZ[s.cat],r=RATIO[s.cat],cap=zs.map(z=>avail(sid,c,z)),out=zs.map(()=>0);
  let left=Math.min(total,cap.reduce((a,b)=>a+b,0));
  for(let guard=0;left>0&&guard<20;guard++){
    const act=zs.map((_,i)=>i).filter(i=>out[i]<cap[i]);if(!act.length)break;
    const w=act.reduce((a,i)=>a+r[i],0),raw=act.map(i=>left*r[i]/w);
    act.forEach((i,j)=>{const g=Math.min(Math.floor(raw[j]),cap[i]-out[i]);out[i]+=g;left-=g});
    const order=act.map((i,j)=>({i,f:raw[j]-Math.floor(raw[j])})).sort((a,b)=>b.f-a.f||r[b.i]-r[a.i]);
    for(const o of order){if(!left)break;if(out[o.i]<cap[o.i]){out[o.i]++;left--}}
  }
  return out;
}

function erpLabel(o){return{placed:'Submitted',review:'Awaiting distributor approval',modified:'Modified · awaiting retailer',approved:'Approved · creating sales order',confirmed:`SO Created · ${o.so}`,processing:'Processing · Invoice pending',dispatched:`Dispatched · AWB ${o.awb}`,delivered:'Delivered',rejected:`Rejected · ${o.reason}`}[o.status]}
function exceptions(){
  const list=[];
  if(S.issueLog)list.push(['s-warn','Stock changed at checkout',`${RETAILER.store}: ${S.issueLog}. Retailer updated the cart before placing.`]);
  if(!S.fixed.includes('CT-10473'))list.push(['s-bad','Sync failed','CT-10473, Style Point: Ginesys did not respond (timeout) after 3 automatic retries. Stock is still held.','CT-10473']);
  list.push(['s-bad','Approval overdue','CT-10476, Rajhans Garments, waiting 5h 02m with Malabar Trade Links.']);
  list.push(['s-warn','Unmatched mobile number','+91 97240 1XXXX tried to activate Om Sai Collection. Sent to manual verification.']);
  list.push(['s-info','ERP retry succeeded','CT-10471 sales order created on second attempt after a timeout. No duplicate created.']);
  return list.map(([c,h,d,id])=>`<div class="exc"><span class="status ${c}" style="flex:0 0 auto">${h}</span><span style="flex:1">${esc(d)}</span>${id?`<button class="btn sec" style="min-height:34px;padding:6px 14px" data-a="retry" data-id="${id}">Retry now</button>`:''}</div>`);
}
function lowStock(){const r=[];for(const s of STYLES)for(const c of s.colors)for(const z of SZ[s.cat]){const q=avail(s.id,c,z);if(q<=LOW)r.push({sku:`${s.id}-${c.slice(0,3).toUpperCase()}-${z}`,n:s.name,c,z,q})}return r.sort((a,b)=>a.q-b.q).slice(0,12)}

let lastKey='';
function render(){
  document.querySelectorAll('#roles button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.role));
  $('#langBtn').textContent=S.lang==='en'?'हिंदी':'English';
  document.documentElement.lang=S.lang==='hi'?'hi':'en';
  document.body.classList.toggle('gopen',!!S.guide);
  document.documentElement.style.setProperty('--stripH',document.querySelector('.strip').offsetHeight+'px');
  if(S.role==='admin')S.visited.admin=true;
  const key=S.role+S.screen+S.pid+S.color+S.selOrder+S.dscreen+S.ascreen+S.view;
  const y=window.scrollY;
  $('#app').innerHTML=S.role==='retailer'?retailer():S.role==='distributor'?distributor():admin();
  $('#overlay').innerHTML=(S.guide?guide():'')+sheet();
  if(key===lastKey)window.scrollTo(0,y);else window.scrollTo(0,0);
  lastKey=key;
  const q=$('#q');if(q&&S.focusQ){q.focus();q.setSelectionRange(q.value.length,q.value.length);S.focusQ=false}
  const mob=$('#mob');if(mob&&S.act.stage===0)mob.focus({preventScroll:true});
}

function stamp(o,st){o.status=st;o.hist[st]=new Date()}

 guide(){S.guide=!S.guide},
 reset(){const g=S.guide,l=S.lang;fresh();S.guide=g;S.lang=l;toast('Demo reset')},
 gstep(d){guide.steps[+d.i][3]();if(!S.act.done&&S.role==='retailer'&&+d.i>0&&+d.i<6)toast('Verify the mobile number first');if(+d.i===4)setTimeout(()=>{const l=document.querySelector('.look');l&&l.scrollIntoView({behavior:'smooth',block:'center'})},50);if(window.innerWidth<1400)S.guide=false},
 sendotp(){const v=$('#mob').value.replace(/\D/g,'');S.act.mobile=v.length>=10?v.slice(0,5)+' '+v.slice(5,10):RETAILER.mobile;S.act.stage=1;S.act.otp='';
   let i=0;const code='482916';const tick=()=>{if(S.act.stage!==1)return;S.act.otp=code.slice(0,++i);render();if(i<6)setTimeout(tick,140)};setTimeout(tick,700)},
 sendotp2(){S.act.otp='';let i=0;const code='482916';const tick=()=>{if(S.act.stage!==1)return;S.act.otp=code.slice(0,++i);render();if(i<6)setTimeout(tick,140)};setTimeout(tick,600);toast('New code sent by SMS')},
 callrep(){toast('You will get a call with the code in a few seconds');return true},
 voice(){toast('Voice search: say a style in Hindi or English, e.g. "white shirt L"');return true},
 verify(){S.act.stage=2;render();setTimeout(()=>{S.act.done=true;S.screen='home';toast('Account activated. Welcome, Sree Balaji Menswear');render()},700);return true},
 go(d){S.sheet=null;if(S.role==='retailer'){S.screen=d.v;if(d.v==='orders')S.selOrder=null;if(d.v==='catalogue')S.focusQ=false}else if(S.role==='distributor')S.dscreen=d.v;else S.ascreen=d.v},
 open(d){S.pid=d.id;S.color=d.c;S.screen='product';S.sheet=null;if(d.look)S.visited.look=true},
 color(d){S.color=d.v},
 cat(d){S.cat=d.v;S.query='';S.filters={fit:[],pattern:[],color:[],instock:S.filters.instock}},
 view(d){S.view=d.v},
 sheet(d){S.sheet=d.v},
 closesheet(d,e){if(e&&e.target.closest('[data-stop]')&&!e.target.closest('button'))return true;S.sheet=null},
 ftog(d){const a=S.filters[d.k];const i=a.indexOf(d.v);i<0?a.push(d.v):a.splice(i,1)},
 instock(){S.filters.instock=!S.filters.instock},
 fclear(){S.filters={fit:[],pattern:[],color:[],instock:false}},
 sort(d){S.sort=d.v;S.sheet=null},
 qty(d,e){const g=e.target.closest('.qgrid');setQty(g,d.z,draftFor(g.dataset.sid,g.dataset.c)[d.z]+(+d.d));updateGrid(g);return true},
 distribute(d,e){const g=e.target.closest('.qgrid'),inp=g.querySelector('.totin'),n=parseInt(inp.value.replace(/\D/g,''))||0;
   if(!n){toast('Type how many pieces you want in total');inp.focus();return true}applySplit(g,n);inp.blur();return true},
 pack(d,e){const g=e.target.closest('.qgrid'),s=S_BY[g.dataset.sid],set=RATIO[s.cat].reduce((a,b)=>a+b,0)*(+d.m);g.querySelector('.totin').value=set;applySplit(g,set,`${d.m} set${+d.m>1?'s':''} (${set} pcs)`);return true},
 lastqty(d,e){const g=e.target.closest('.qgrid'),last=lastQty(g.dataset.sid,g.dataset.c);let cut=0;for(const z in last.q){const got=setQty(g,z,last.q[z]);if(got<last.q[z])cut++}updateGrid(g);toast(`Filled from ${last.id} (${last.date})${cut?`. ${cut} size${cut>1?'s':''} capped at stock`:''}`);return true},
 clearqty(d,e){const g=e.target.closest('.qgrid'),dr=draftFor(g.dataset.sid,g.dataset.c);for(const z in dr)dr[z]=0;g.querySelector('.totin').value='';g.querySelectorAll('.rn').forEach(x=>x.textContent='');updateGrid(g);return true},
 copycolors(d,e){const g=e.target.closest('.qgrid'),sid=g.dataset.sid,s=S_BY[sid],dr=draftFor(sid,g.dataset.c);let n=0,cut=0;
   for(const c of s.colors)for(const z of SZ[s.cat]){const want=dr[z];if(!want)continue;const q=Math.min(want,avail(sid,c,z));if(q<want)cut++;n+=q;if(q)addLines([{sid,c,z,q}])}
   S.draft[keyOf(sid,g.dataset.c)]=null;S.checked=false;if(S.sheet&&S.sheet.type==='quick')S.sheet=null;
   toast(`${n} pcs added across ${s.colors.length} colours${cut?`. ${cut} size${cut>1?'s':''} capped at stock`:''}`)},
 quick(d){S.sheet={type:'quick',sid:d.id,c:d.c,mode:'add'}},
 qcolor(d){S.sheet.c=d.v},
 editline(d){const[sid,c]=d.k.split('|');const dr=draftFor(sid,c);for(const z in dr){const l=S.cart.find(x=>x.sid===sid&&x.c===c&&x.z===z);dr[z]=l?l.q:0}S.sheet={type:'quick',sid,c,mode:'edit'}},
 applyquick(){const q=S.sheet,dr=draftFor(q.sid,q.c),n=sumDraft(dr);
   if(q.mode==='edit')S.cart=S.cart.filter(l=>!(l.sid===q.sid&&l.c===q.c));
   addLines(Object.entries(dr).map(([z,qq])=>({sid:q.sid,c:q.c,z,q:qq})));S.draft[keyOf(q.sid,q.c)]=null;S.checked=false;S.sheet=null;
   if(S.issue&&S.issue.sid===q.sid&&S.issue.c===q.c)S.issue=null;
   toast(q.mode==='edit'?(n?`Cart updated: ${S_BY[q.sid].name}, ${n} pcs`:'Removed from cart'):`${n} pcs added to cart`)},
 addcart(){const k=S.pid+'|'+S.color,d=draftFor(S.pid,S.color);addLines(Object.entries(d).map(([z,q])=>({sid:S.pid,c:S.color,z,q})));const n=Object.values(d).reduce((a,b)=>a+b,0);S.draft[k]=null;S.checked=false;toast(`${n} pcs added to cart`)},
 reorder(d){const p=PAST.find(x=>x.id===d.id);let ok=0,cut=0,miss=[],cuts=[];const lines=[];
   for(const[sid,c,mult]of p.lines){const s=S_BY[sid];SZ[s.cat].forEach((z,i)=>{const want=RATIO[s.cat][i]*mult*2,n=avail(sid,c,z);if(!n){miss.push(`${s.name}, ${c}, ${z}`);return}const q=Math.min(want,n);if(q<want){cut++;cuts.push(`${s.name}, ${c}, ${z}: ${want} → ${q}`)}ok+=q;lines.push({sid,c,z,q})})}
   S.sheet={type:'reorder',id:p.id,date:p.date,ok,miss,cut,cuts,lines}},
 reorderok(){const r=S.sheet;addLines(r.lines);S.checked=false;S.sheet=null;S.screen='cart';toast(`${r.ok} pcs from ${r.id} added. Edit any size below`)},
 rmline(d){const[sid,c]=d.k.split('|');const before=S.cart.map(l=>({...l})),iss=S.issue;S.cart=S.cart.filter(l=>!(l.sid===sid&&l.c===c));if(S.issue&&S.issue.sid===sid&&S.issue.c===c)S.issue=null;
   toast(`Removed ${S_BY[sid].name}, ${c}`,()=>{S.cart=before;S.issue=iss;render()})},
 retry(d){S.fixed.push(d.id);toast(`${d.id}: sales order created in Ginesys on retry`)},
 sharecart(){toast('Cart summary with sizes and total ready to share on WhatsApp');return true},
 sharepdf(){toast('Order PDF downloaded');return true},
 undo(){const f=toast.undo;$('#toast').hidden=true;toast.undo=null;if(f)f();return true},
 submit(){
   if(S.submitting)return true;
   S.submitting='Checking live stock…';render();
   setTimeout(()=>{
     if(!S.checked){
       const big=[...S.cart].sort((a,b)=>b.q-a.q)[0];
       const now=Math.max(1,Math.floor(big.q/2));
       STOCK[`${big.sid}|${big.c}|${big.z}`]=now;
       S.issue={sid:big.sid,c:big.c,z:big.z,had:big.q,now};S.issueLog=`${S_BY[big.sid].name} ${big.c} ${big.z} dropped from ${big.q} to ${now}`;
       S.checked=true;S.submitting=false;render();window.scrollTo({top:0,behavior:'smooth'});return;
     }
     S.submitting='Placing order…';render();
     setTimeout(()=>{
       const id='CT-10482',now=new Date();
       const o={id,store:RETAILER.store,city:'Kochi',lines:S.cart.map(l=>({...l})),orig:S.cart.map(l=>({...l})),note:S.note.trim(),po:S.po.trim(),status:'review',hist:{placed:now,review:now},demo:true};S.note='';S.po='';
       for(const l of o.lines)STOCK[`${l.sid}|${l.c}|${l.z}`]=Math.max(0,avail(l.sid,l.c,l.z)-l.q);
       S.orders.unshift(o);S.dist.unshift(o);S.cart=[];S.submitting=false;S.screen='placed';S.distSel=id;render();
     },900);
   },1100);return true},
 fixissue(){const i=S.issue,l=S.cart.find(x=>x.sid===i.sid&&x.c===i.c&&x.z===i.z);l.q=i.now;S.issue=null;toast(`Updated to ${i.now}. Ready to place`)},
 dropissue(){const i=S.issue;S.cart=S.cart.filter(x=>!(x.sid===i.sid&&x.c===i.c&&x.z===i.z));S.issue=null},
 order(d){S.screen='orders';S.selOrder=d.id},
 backorders(){S.selOrder=null},
 declinemod(d){const o=S.orders.find(x=>x.id===d.id);o.reason='Cancelled by you after changes were proposed';stamp(o,'cancelled');for(const l of (o.orig||o.lines))STOCK[`${l.sid}|${l.c}|${l.z}`]=avail(l.sid,l.c,l.z)+l.q;toast(`${o.id} cancelled. Held stock released`)},
 acceptmod(d){const o=S.orders.find(x=>x.id===d.id);approve(o);toast('Changes accepted. Order approved')},
 erp(d){const o=S.orders.find(x=>x.id===d.id);const nx={confirmed:'processing',processing:'dispatched',dispatched:'delivered'}[o.status];if(!nx)return;if(nx==='dispatched')o.awb='14902286553';stamp(o,nx);if(nx==='delivered'){S.points+=sumP(o.lines);toast(`Delivered. +${sumP(o.lines)} points added`)}else toast(`Update from Ginesys: ${rLabel(nx)}`)},
 dsel(d){S.distSel=d.id;S.edit=null;S.rej=null},
 dapprove(d){const o=S.dist.find(x=>x.id===d.id);approve(o);toast(`${o.id} approved. Sending to CITRUS`)},
 dmod(d){const o=S.dist.find(x=>x.id===d.id);S.edit={id:o.id,q:o.lines.map(l=>l.q)};S.rej=null},
 dq(d){const o=S.dist.find(x=>x.id===S.edit.id);const i=+d.i;S.edit.q[i]=Math.max(0,Math.min(o.lines[i].q,S.edit.q[i]+(+d.d)))},
 modreason(d){S.edit.reason=d.v},
 canceledit(){S.edit=null},
 dmod2(){const o=S.dist.find(x=>x.id===S.edit.id);const ch=[];o.lines.forEach((l,i)=>{if(S.edit.q[i]!==l.q)ch.push({sid:l.sid,c:l.c,z:l.z,from:l.q,to:S.edit.q[i]})});
   if(!ch.length){toast('No changes made');S.edit=null;return}
   o.changes=ch;o.modReason=S.edit.reason;o.lines=o.lines.map((l,i)=>({...l,q:S.edit.q[i]})).filter(l=>l.q>0);stamp(o,'modified');S.edit=null;moveDone(o);toast('Changes sent to the retailer')},
 dreject(d){S.rej={id:d.id,reason:null};S.edit=null},
 rejreason(d){S.rej.reason=d.v},
 cancelrej(){S.rej=null},
 dreject2(){const o=S.dist.find(x=>x.id===S.rej.id);o.reason=S.rej.reason;stamp(o,'rejected');S.rej=null;moveDone(o);toast(`${o.id} rejected. Retailer notified`)},
};
function moveDone(o){S.dist=S.dist.filter(x=>x!==o);if(!S.done.includes(o))S.done.unshift(o);S.distSel=null}
function approve(o){stamp(o,'approved');moveDone(o);render();
  setTimeout(()=>{o.so='SO/KL/26-27/04821';stamp(o,'confirmed');render()},1400)}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.tagName==='INPUT'&&el.dataset.a!=='go')return;
  const f=A[el.dataset.a];if(!f)return;
  const stop=f(el.dataset,e);if(stop!==true)render();
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.query=e.target.value;const r=$('#results');if(r)r.innerHTML=results()}
  if(e.target.id==='note'){S.note=e.target.value}
  if(e.target.id==='po'){S.po=e.target.value}
  if(e.target.id==='mob'){e.target.value=e.target.value.replace(/[^\d ]/g,'')}
  const el=e.target;
  if(el.classList.contains('qin')){const v=el.value.replace(/\D/g,'').slice(0,4);if(v!==el.value)el.value=v;const g=el.closest('.qgrid');const got=setQty(g,el.dataset.z,+v||0);if(v!==''&&got!==+v)el.value=got;updateGrid(g)}
  if(el.classList.contains('cin')){const v=el.value.replace(/\D/g,'').slice(0,4);if(v!==el.value)el.value=v;const got=setCartQty(el.dataset.k,el.dataset.z,+v||0);if(v!==''&&got!==+v)el.value=got;updateCart()}
  if(el.classList.contains('totin')){const v=el.value.replace(/\D/g,'').slice(0,5);if(v!==el.value)el.value=v}
  if(el.classList.contains('dqin')&&S.edit){const o=S.dist.find(x=>x.id===S.edit.id),i=+el.dataset.i,max=o.lines[i].q;const v=el.value.replace(/\D/g,'');const q=Math.min(max,+v||0);S.edit.q[i]=q;el.value=v===''?'':q;if(+v>max)toast(`Can only reduce. Ordered ${max}`)}
});
document.addEventListener('change',e=>{const el=e.target;if(!(el.tagName==='SELECT'&&el.closest('.csel')))return;
  const[sid,from]=el.dataset.k.split('|'),to=el.value,s=S_BY[sid],old=S.cart.filter(l=>l.sid===sid&&l.c===from);let moved=0,cut=0;
  S.cart=S.cart.filter(l=>!old.includes(l));for(const l of old){const ex=S.cart.find(x=>x.sid===sid&&x.c===to&&x.z===l.z),n=avail(sid,to,l.z),q=Math.min(n,l.q+(ex?ex.q:0));if(q<l.q+(ex?ex.q:0))cut++;if(ex){ex.q=q}else if(q)S.cart.push({sid,c:to,z:l.z,q});moved+=q}
  if(S.issue&&S.issue.sid===sid&&S.issue.c===from)S.issue=null;S.checked=false;render();toast(`Changed to ${to}${cut?`. ${cut} size${cut>1?'s':''} reduced to stock`:''}`)});
document.addEventListener('focusin',e=>{const el=e.target;if(el.matches&&el.matches('.qin,.totin,.dqin,.cin'))setTimeout(()=>{try{el.select()}catch(_){}},0)});
document.addEventListener('focusout',e=>{const el=e.target;if(el.classList&&el.classList.contains('dqin')&&el.value==='')el.value=S.edit?S.edit.q[+el.dataset.i]:0});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(S.sheet||S.guide)){S.sheet=null;if(window.innerWidth<1400)S.guide=false;render()}
  if(e.key==='Enter'&&e.target.id==='mob'){A.sendotp();render()}
  const el=e.target;
  if(e.key==='Enter'&&el.classList.contains('totin')){e.preventDefault();A.distribute({},{target:el})}
  if(e.key==='Enter'&&(el.classList.contains('qin')||el.classList.contains('dqin')||el.classList.contains('cin'))){e.preventDefault();const scope=el.closest('.qgrid,table,.cartl')||document;const all=[...scope.querySelectorAll(el.classList.contains('dqin')?'.dqin':'.'+el.classList[0]+':not(:disabled)')];const nx=all[all.indexOf(el)+1];if(nx)nx.focus();else{el.blur();const add=(el.closest('.sheet')||document).querySelector('[data-gadd]');add&&add.focus()}}
  if((e.key==='Enter'||e.key===' ')&&el.getAttribute&&el.getAttribute('role')==='link'&&el.dataset.a){e.preventDefault();A[el.dataset.a](el.dataset,e);render()}
});

fresh();render();
window.addEventListener('resize',()=>document.documentElement.style.setProperty('--stripH',document.querySelector('.strip').offsetHeight+'px'));
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.host))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
